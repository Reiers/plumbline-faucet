# Mainnet preview location block.
#
# Include inside the existing "server { ... server_name faucet.reiers.io; }"
# block that serves the calibration faucet (port 443). The mainnet
# instance listens on 127.0.0.1:8006 and serves its own routes at "/";
# the trailing slash on proxy_pass strips the /mainnet prefix.
#
# The server block's existing set_real_ip_from / real_ip_header
# CF-Connecting-IP lines make $remote_addr the real client IP. We pass
# exactly that (not $proxy_add_x_forwarded_for, which would keep any
# client-supplied X-Forwarded-For). The mainnet app only trusts
# X-Forwarded-For from 127.0.0.1.

location = /mainnet {
    return 301 /mainnet/;
}

location /mainnet/ {
    proxy_pass http://127.0.0.1:8006/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    # Drips return within MAINNET_RECEIPT_TIMEOUT_MS (60s) plus queue
    # time; stay under the Cloudflare 100s origin timeout.
    proxy_read_timeout 95s;
    proxy_connect_timeout 10s;
    client_max_body_size 4k;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}
